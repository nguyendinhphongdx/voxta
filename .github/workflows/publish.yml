name: Publish to npm

# Mirror cách console (repo GitLab CI khác của cùng tác giả) làm: KHÔNG qua PR review — commit
# thẳng version bump vào `main` (kèm `[skip ci]` để GitHub tự bỏ qua, tránh workflow tự trigger lại
# chính commit nó vừa tạo), rồi publish luôn trong CÙNG 1 job. Chỉ chạy khi push có đổi file trong
# `.changeset/` (paths filter) — không chạy lại mỗi lần push code thường.
on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack (pnpm version pin trong package.json)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages (bump + CHANGELOG.md, gộp mọi changeset đang chờ)
        # `pnpm version` (không "run") là lệnh BUILT-IN của pnpm (in bảng version của pnpm/node/
        # dependency, giống `npm version` không tham số) — KHÔNG chạy script "version" tự định
        # nghĩa trong package.json. Đã tái hiện thật: package.json chưa bao giờ được bump, dù job
        # này "pass" (exit 0) bình thường vì lệnh built-in đó vẫn chạy thành công, chỉ là làm sai
        # việc. Gọi thẳng `npx changeset version`, không qua alias "version" mập mờ giữa pnpm và
        # script tự định nghĩa.
        run: |
          git config user.email "voxta-ci@users.noreply.github.com"
          git config user.name "voxta CI"
          npx changeset version
          git add -A
          git diff --cached --quiet || git commit -m "ci: version packages [skip ci]"
          git push origin HEAD:main

      - name: Build
        run: pnpm build

      - name: Chuẩn bị .next/standalone (copy static, fix symlink better-sqlite3)
        run: ./scripts/prepare-standalone.sh

      - name: Publish lên npm
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
