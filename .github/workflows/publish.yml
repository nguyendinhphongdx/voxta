name: Publish to npm

# Chạy khi push tag dạng v1.2.3 (khớp version trong package.json — bị chặn ở bước verify bên dưới
# nếu lệch), hoặc chạy tay qua "Run workflow" trên GitHub (workflow_dispatch) để test mà không cần
# tạo tag thật.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  # Cho npm provenance (đính kèm bằng chứng "package này build từ đúng commit/workflow nào" vào
  # gói publish — npm hiện thị badge "Provenance" trên trang package) — cần OIDC token của GitHub.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack (pnpm version pin trong package.json)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Chuẩn bị .next/standalone (copy static, fix symlink better-sqlite3)
        run: ./scripts/prepare-standalone.sh

      - name: Kiểm tra tag khớp version trong package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION không khớp version trong package.json ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Publish lên npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
