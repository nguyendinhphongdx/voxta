name: Publish to npm

# Chạy MỖI KHI push lên main (khác hẳn cách cũ dựa vào tag) — changesets/action tự quyết định làm
# gì tuỳ trạng thái:
#   - Có file changeset đang chờ (`.changeset/*.md`, tạo qua `pnpm changeset`) → mở/cập nhật 1 PR
#     tên "Version Packages" tự bump version trong package.json + viết CHANGELOG.md, gộp hết
#     changeset đang chờ lại. KHÔNG publish gì ở bước này.
#   - Không còn changeset nào chờ (nghĩa là PR "Version Packages" vừa được merge) → chạy lệnh
#     `publish` khai báo bên dưới, publish thật lên npm.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack (pnpm version pin trong package.json)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Chuẩn bị .next/standalone (copy static, fix symlink better-sqlite3)
        run: ./scripts/prepare-standalone.sh

      - name: Version Packages hoặc Publish
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
          version: npx changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
